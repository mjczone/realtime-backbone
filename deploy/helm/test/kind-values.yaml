# Test only: values for the kind smoke test.
centrifugo:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  image:
    pullPolicy: Never
  initContainers:
    - name: realtime-doctor
      image: ghcr.io/mjczone/realtime-backbone:0.3.0
      imagePullPolicy: Never
      command: ["realtime-doctor", "--mode", "strict"]
      envFrom:
        - secretRef:
            name: realtime-backbone-secrets
        - configMapRef:
            name: realtime-backbone-env
      volumeMounts:
        - name: realtime-backbone-config
          mountPath: /centrifugo
          readOnly: true
  resources: {}
