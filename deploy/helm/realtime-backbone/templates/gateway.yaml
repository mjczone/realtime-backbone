{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-backbone-gateway
  labels:
    {{- include "rtb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "rtb.gatewaySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rtb.gatewaySelector" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: gateway
          image: {{ .Values.gateway.image.registry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}
          envFrom:
            - secretRef:
                name: {{ .Values.gateway.secretName }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-backbone-gateway
  labels:
    {{- include "rtb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "rtb.gatewaySelector" . | nindent 4 }}
  ports:
    - name: http
      port: 8090
      targetPort: http
{{- end }}
