apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-doctor
  labels:
    {{- include "rtb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: rtb-doctor
      image: {{ include "rtb.image" . }}
      command: ["rtb-doctor", "--mode", "strict"]
      envFrom:
        - secretRef:
            name: {{ .Values.backbone.secretName }}
        - configMapRef:
            name: {{ .Values.backbone.envConfigMapName }}
      volumeMounts:
        - name: config
          mountPath: /centrifugo
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: config
      configMap:
        name: {{ .Values.centrifugo.fullnameOverride }}-config
