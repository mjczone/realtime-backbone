{{- if .Values.networkPolicy.enabled }}
# The client port is open to anyone (the ingress sits in front of it). The API ports only accept
# publishers from labeled namespaces, plus Prometheus for /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backbone
  labels:
    {{- include "rtb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rtb.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ dig "servers" "external" "port" 8000 .Values.centrifugo }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.publisherNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ dig "servers" "internal" "port" 9000 .Values.centrifugo }}
        - port: {{ dig "servers" "grpc" "port" 10000 .Values.centrifugo }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ dig "servers" "internal" "port" 9000 .Values.centrifugo }}
{{- end }}
