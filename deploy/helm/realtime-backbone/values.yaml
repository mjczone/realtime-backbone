# Names are fixed so the rtb-doctor init container (set in values below) can reach the same
# ConfigMap, Secret and env as Centrifugo. Install one release per namespace, or change all three.
backbone:
  # A Secret you create (External Secrets, the CSI driver, or kubectl). This chart never takes secret values.
  # Keys: CENTRIFUGO_HTTP_API_KEY, CENTRIFUGO_GRPC_API_KEY, CENTRIFUGO_ENGINE_REDIS_ADDRESS
  # (and CENTRIFUGO_ENGINE_REDIS_PASSWORD if the password is not in the address).
  secretName: &secretName realtime-backbone-secrets
  # A ConfigMap this chart creates from `env`.
  envConfigMapName: &envName realtime-backbone-env
  env:
    CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "https://app.example.com"
    CENTRIFUGO_CLIENT_TOKEN_JWKS_PUBLIC_ENDPOINT: "https://app.example.com/.well-known/rtb-jwks.json"
    CENTRIFUGO_CLIENT_TOKEN_AUDIENCE: "realtime-backbone"
    CENTRIFUGO_CLIENT_TOKEN_ISSUER: "app.example.com"
    CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_JWKS_PUBLIC_ENDPOINT: "https://app.example.com/.well-known/rtb-jwks.json"
    CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_AUDIENCE: "realtime-backbone"
    CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_ISSUER: "app.example.com"

networkPolicy:
  enabled: true
  # Pods allowed to reach the HTTP API (9000) and gRPC API (10000): namespaces with this label.
  publisherNamespaceSelector:
    matchLabels:
      realtime-backbone/publisher: "true"
  # Prometheus, allowed to scrape /metrics on 9000.
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring

prometheusRule:
  enabled: false
  labels: {}
  # Alert when p99 pub/sub lag stays above this many seconds.
  pubSubLagSeconds: 0.5
  # Alert when one node holds more than this many connections.
  connectionsPerNode: 50000
  # Alert when the API error rate is above this many errors per second.
  apiErrorsPerSecond: 1

# A small dashboard as a ConfigMap for the Grafana sidecar. The official Centrifugo dashboard is
# grafana.com dashboard 13039; import it as well for the full picture.
dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

# Optional cert-manager certificates for mTLS on the gRPC API. Short lifetimes, because Centrifugo
# does not check CRLs or OCSP: cutting a component off means not renewing its certificate.
certificates:
  enabled: false
  issuerRef:
    name: realtime-backbone-ca
    kind: Issuer
  duration: 24h
  renewBefore: 8h
  # One client certificate (and Secret) per publishing component.
  clients: []
  #  - quality-agent
  #  - billing-worker

centrifugo:
  fullnameOverride: realtime-backbone
  image:
    registry: ghcr.io
    repository: mattjcowan/realtime-backbone
    tag: "0.1.0"
  replicaCount: 3
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  # Keep the API ports off the public Service.
  serviceInternal:
    useSeparate: true
  serviceGrpc:
    useSeparate: true
  existingSecret: *secretName
  envFrom:
    - configMapRef:
        name: *envName
  initContainers:
    - name: rtb-doctor
      image: ghcr.io/mattjcowan/realtime-backbone:0.1.0
      # warn logs problems and starts anyway; strict refuses to start on a failure.
      command: ["rtb-doctor", "--mode", "warn"]
      envFrom:
        - secretRef:
            name: *secretName
        - configMapRef:
            name: *envName
      volumeMounts:
        - name: realtime-backbone-config
          mountPath: /centrifugo
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  metrics:
    serviceMonitor:
      enabled: false
  ingress:
    enabled: false
