# Dev stack only: builds images from this repo. See deploy/compose for single-host deployments.
# Ports: RTB_CLIENT_PORT (default 8000) and RTB_DEMO_PORT (default 8080), from the shell or a .env file.
# Samples: docker compose --profile samples up -d --build (RTB_SAMPLE_PORT 3001, RTB_MAF_SAMPLE_PORT 3002, RTB_PY_SAMPLE_PORT 3003, RTB_LANGGRAPH_SAMPLE_PORT 3004,
# RTB_MDN_API_PORT 3010 and RTB_MDN_AGENT_PORT 3011 for the Mastra + .NET sample, RTB_MDN_GW_API_PORT 3012 for the same
# sample through rtb-gateway). The gateway listens on RTB_GATEWAY_PORT (default 8090).
# Backtest worker: docker compose --profile signals run --rm py-signals
name: rtb-dev

services:
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: valkey-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - ./.data/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  backbone:
    build:
      context: .
      dockerfile: images/backbone/Dockerfile
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      RTB_DOCTOR: warn
      CENTRIFUGO_HTTP_API_KEY: dev-api-key
      CENTRIFUGO_GRPC_API_KEY: dev-grpc-key
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://valkey:6379
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: http://localhost:${RTB_DEMO_PORT:-8080} http://localhost:${RTB_SAMPLE_PORT:-3001} http://localhost:${RTB_MAF_SAMPLE_PORT:-3002} http://localhost:${RTB_PY_SAMPLE_PORT:-3003} http://localhost:${RTB_LANGGRAPH_SAMPLE_PORT:-3004} http://localhost:${RTB_MDN_API_PORT:-3010} http://localhost:${RTB_MDN_GW_API_PORT:-3012}
      CENTRIFUGO_CLIENT_TOKEN_JWKS_PUBLIC_ENDPOINT: http://demo:8080/.well-known/rtb-jwks.json
      CENTRIFUGO_CLIENT_TOKEN_AUDIENCE: realtime-backbone-dev
      CENTRIFUGO_CLIENT_TOKEN_ISSUER: rtb-demo
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_JWKS_PUBLIC_ENDPOINT: http://demo:8080/.well-known/rtb-jwks.json
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_AUDIENCE: realtime-backbone-dev
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_ISSUER: rtb-demo
      # Dev only: the admin UI on the client port, at http://localhost:${RTB_CLIENT_PORT:-8000} (password: dev).
      CENTRIFUGO_ADMIN_ENABLED: "true"
      CENTRIFUGO_ADMIN_EXTERNAL: "true"
      CENTRIFUGO_ADMIN_PASSWORD: dev
      CENTRIFUGO_ADMIN_SECRET: dev-admin-secret
    ports:
      - "${RTB_CLIENT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  demo:
    build:
      context: .
      dockerfile: images/demo/Dockerfile
    depends_on:
      backbone:
        condition: service_healthy
    environment:
      RTB_API_URL: http://backbone:9000/api
      RTB_API_KEY: dev-api-key
      RTB_PUBLIC_BACKBONE_URL: http://localhost:${RTB_CLIENT_PORT:-8000}
      RTB_TOKEN_AUDIENCE: realtime-backbone-dev
      RTB_TOKEN_ISSUER: rtb-demo
    volumes:
      - ./.data/keys:/data/keys
    ports:
      - "${RTB_DEMO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: images/gateway/Dockerfile
    depends_on:
      demo:
        condition: service_healthy
    environment:
      RTB_GATEWAY_CONFIG: /etc/rtb-gateway/gateway.json
      RTB_PUBLIC_BACKBONE_URL: http://localhost:${RTB_CLIENT_PORT:-8000}
      RTB_MDN_GW_ORIGIN: http://localhost:${RTB_MDN_GW_API_PORT:-3012}
    volumes:
      - ./config/gateway.dev.json:/etc/rtb-gateway/gateway.json:ro
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_GATEWAY_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  mastra-chat:
    profiles: [samples]
    build:
      context: .
      dockerfile: samples/mastra-chat/Dockerfile
    depends_on:
      demo:
        condition: service_healthy
    environment:
      RTB_API_URL: http://backbone:9000/api
      RTB_API_KEY: dev-api-key
      RTB_PUBLIC_BACKBONE_URL: http://localhost:${RTB_CLIENT_PORT:-8000}
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
      MODEL: ${MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_SAMPLE_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  maf-chat:
    profiles: [samples]
    build:
      context: .
      dockerfile: samples/maf-chat/Dockerfile
    depends_on:
      demo:
        condition: service_healthy
    environment:
      RTB_GRPC_ADDRESS: http://backbone:10000
      RTB_GRPC_KEY: dev-grpc-key
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      RTB_PUBLIC_BACKBONE_URL: http://localhost:${RTB_CLIENT_PORT:-8000}
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
    volumes:
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_MAF_SAMPLE_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  py-chat:
    profiles: [samples]
    image: rtb-sample-py-chat:dev
    build:
      context: .
      dockerfile: samples/py-chat/Dockerfile
    depends_on:
      demo:
        condition: service_healthy
    environment:
      AGENT: pydantic-ai
      PYDANTIC_AI_NO_BANNER: "1"
      RTB_API_URL: http://backbone:9000/api
      RTB_API_KEY: dev-api-key
      RTB_PUBLIC_BACKBONE_URL: http://localhost:${RTB_CLIENT_PORT:-8000}
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
    volumes:
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_PY_SAMPLE_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 30

  py-langgraph:
    profiles: [samples]
    image: rtb-sample-py-chat:dev
    depends_on:
      py-chat:
        condition: service_started
    environment:
      AGENT: langgraph
      RTB_API_URL: http://backbone:9000/api
      RTB_API_KEY: dev-api-key
      RTB_PUBLIC_BACKBONE_URL: http://localhost:${RTB_CLIENT_PORT:-8000}
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
    volumes:
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_LANGGRAPH_SAMPLE_PORT:-3004}:3003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 30

  mdn-api:
    profiles: [samples]
    image: rtb-sample-mdn-api:dev
    build:
      context: .
      dockerfile: samples/mastra-dotnet/api/Dockerfile
    depends_on:
      demo:
        condition: service_healthy
    environment:
      RTB_GRPC_ADDRESS: http://backbone:10000
      RTB_GRPC_KEY: dev-grpc-key
      RTB_PUBLIC_BACKBONE_URL: http://localhost:${RTB_CLIENT_PORT:-8000}
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
      MDN_PUBLIC_AGENT_URL: http://localhost:${RTB_MDN_AGENT_PORT:-3011}
      MDN_INTERNAL_KEY: dev-internal-key
    volumes:
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_MDN_API_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  mdn-agent:
    profiles: [samples]
    image: rtb-sample-mdn-agent:dev
    build:
      context: .
      dockerfile: samples/mastra-dotnet/agent/Dockerfile
    depends_on:
      mdn-api:
        condition: service_healthy
    environment:
      MDN_API_URL: http://mdn-api:3010
      MDN_INTERNAL_KEY: dev-internal-key
      MDN_PAGE_ORIGIN: http://localhost:${RTB_MDN_API_PORT:-3010}
      RTB_API_URL: http://backbone:9000/api
      RTB_API_KEY: dev-api-key
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
      MODEL: ${MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_MDN_AGENT_PORT:-3011}:3011"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3011/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The same sample through rtb-gateway: the API publishes with a plain HTTP POST, the page loads the gateway's client,
  # and the agent serves a plain AG-UI endpoint. Its own API and agent copies, since each API copy has its own login key.
  mdn-api-gw:
    profiles: [samples]
    image: rtb-sample-mdn-api:dev
    build:
      context: .
      dockerfile: samples/mastra-dotnet/api/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PORT: "3012"
      RTB_GATEWAY_URL: http://gateway:8090
      RTB_PUBLIC_GATEWAY_URL: http://localhost:${RTB_GATEWAY_PORT:-8090}
      RTB_GATEWAY_KEY: dev-gateway-key
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
      MDN_INTERNAL_KEY: dev-internal-key
    volumes:
      - ./.data/keys:/data/keys:ro
    ports:
      - "${RTB_MDN_GW_API_PORT:-3012}:3012"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3012/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  mdn-agent-gw:
    profiles: [samples]
    image: rtb-sample-mdn-agent:dev
    build:
      context: .
      dockerfile: samples/mastra-dotnet/agent/Dockerfile
    depends_on:
      mdn-api-gw:
        condition: service_healthy
    environment:
      MDN_API_URL: http://mdn-api-gw:3012
      RTB_DEV_KEY_FILE: /data/keys/signing.jwk
      MODEL: ${MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./.data/keys:/data/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3011/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  py-signals:
    profiles: [signals]
    build:
      context: .
      dockerfile: samples/py-signals/Dockerfile
    depends_on:
      backbone:
        condition: service_healthy
    environment:
      RTB_GRPC_ADDRESS: backbone:10000
      RTB_GRPC_KEY: dev-grpc-key
      SPEED: ${SPEED:-50}
      CANDLES: ${CANDLES:-390}
      SYMBOL: ${SYMBOL:-ESZ6}
