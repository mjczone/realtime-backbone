[project]
name = "mjczone-realtime-agui"
version = "0.0.0"
description = "Publish an AG-UI agent run (Pydantic AI, LangGraph or any AG-UI source) to the realtime backbone, plus run endpoints"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mjczone-realtime-contract", "mjczone-realtime-publisher", "mjczone-realtime-tokens[starlette]"]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim[ag-ui]>=2.55"]
# ag-ui-langgraph imports fastapi at import time, so the fastapi extra is needed.
langgraph = ["ag-ui-langgraph[fastapi]>=0.0.47", "langgraph>=1.2"]

[project.urls]
Repository = "https://github.com/mjczone/realtime-backbone"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
