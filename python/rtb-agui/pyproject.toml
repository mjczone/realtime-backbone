[project]
name = "rtb-agui"
version = "0.0.0"
description = "Publish an AG-UI agent run (Pydantic AI or any AG-UI source) to the realtime backbone, plus run endpoints"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["rtb-contract", "rtb-publisher", "rtb-tokens[starlette]"]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim[ag-ui]>=2.55"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
