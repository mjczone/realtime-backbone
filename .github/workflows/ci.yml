name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @mjczone/realtime-gateway-web typecheck
      - run: node scripts/sync-helm-config.mjs --check

  doctor:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8.1.10-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tools/doctor/go.sum
      - name: Unit tests and a healthy Valkey
        working-directory: tools/doctor
        env:
          RTB_TEST_REDIS: redis://localhost:6379
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Fails against a misconfigured Valkey
        working-directory: tools/doctor
        run: |
          docker run -d --name bad -p 6380:6379 valkey/valkey:8.1.10-alpine valkey-server --maxmemory-policy allkeys-lru
          sleep 2
          docker exec bad valkey-cli ACL SETUSER default -@scripting
          RTB_TEST_REDIS=redis://localhost:6380 RTB_TEST_EXPECT=fail go test -run Backplane -v ./...

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Unit tests and conformance vectors
        working-directory: dotnet
        run: |
          for p in test/MJCZone.Realtime.Contract.Tests test/MJCZone.Realtime.Publisher.Tests test/MJCZone.Realtime.Tokens.Tests test/MJCZone.Realtime.AgUi.Tests; do
            dotnet test --project "$p"
          done

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - run: uv sync --all-packages --all-extras --locked
      - run: uv run ruff check . ../samples/py-chat ../samples/py-signals
      - run: uv run ruff format --check . ../samples/py-chat ../samples/py-signals
      - name: Unit tests, conformance vectors and sample tests
        run: uv run pytest
      - name: Integration tests (Testcontainers)
        run: uv run pytest -m integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: TypeScript integration tests (Testcontainers)
        run: pnpm --filter @mjczone/realtime-integration test:integration
      - name: .NET integration tests (Testcontainers)
        working-directory: dotnet
        run: dotnet test --project test/MJCZone.Realtime.IntegrationTests

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: gateway/go.sum
      - name: Unit tests and the shared contract vectors
        working-directory: gateway
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dev stack and samples
        run: |
          pnpm dev:up
          docker compose --profile samples up -d --build --wait
      - name: Doctor passes against the dev stack
        run: docker compose exec -T backbone realtime-doctor
      - name: The API is not on the client port, and the internal port is not published
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/publish)" = 404
          ! curl -s -m 2 http://localhost:9000/health
      - name: Test page
        run: pnpm --filter @mjczone/realtime-e2e test tests/demo.spec.ts
      - name: Mastra sample
        run: pnpm --filter @mjczone/realtime-e2e test tests/chat.spec.ts
      - name: MAF sample
        env:
          RTB_SAMPLE_URL: http://localhost:3002
        run: pnpm --filter @mjczone/realtime-e2e test tests/chat.spec.ts
      - name: Pydantic AI sample
        env:
          RTB_SAMPLE_URL: http://localhost:3003
        run: pnpm --filter @mjczone/realtime-e2e test tests/chat.spec.ts
      - name: LangGraph sample
        env:
          RTB_SAMPLE_URL: http://localhost:3004
        run: pnpm --filter @mjczone/realtime-e2e test tests/chat.spec.ts
      - name: Mastra + .NET sample (frontend tools, approvals)
        run: pnpm --filter @mjczone/realtime-e2e test tests/mastra-dotnet.spec.ts
      - name: The same sample through realtime-gateway
        env:
          RTB_MDN_URL: http://localhost:3012
        run: pnpm --filter @mjczone/realtime-e2e test tests/mastra-dotnet.spec.ts
      - name: Backtest worker
        run: |
          docker compose --profile signals run --rm -e SPEED=0 py-signals | tee /dev/stderr | grep -q "'publishFailures': 0"
      - name: Purge leaves nothing behind
        run: |
          docker compose --profile samples down
          pnpm dev:purge
          test ! -e .data
          test -z "$(docker ps -aq --filter name=rtb-dev)"
      - if: failure()
        run: docker compose --profile samples logs

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: rtb
      - name: Lint
        run: |
          helm repo add centrifugal https://centrifugal.github.io/helm-charts
          helm dependency build deploy/helm/realtime-backbone
          helm lint deploy/helm/realtime-backbone --set prometheusRule.enabled=true --set dashboard.enabled=true
      - name: Install on kind and run helm test
        run: |
          docker build -f images/backbone/Dockerfile -t ghcr.io/mjczone/realtime-backbone:0.3.0 .
          docker build -f images/gateway/Dockerfile -t ghcr.io/mjczone/realtime-backbone-gateway:0.3.0 .
          kind load docker-image ghcr.io/mjczone/realtime-backbone:0.3.0 ghcr.io/mjczone/realtime-backbone-gateway:0.3.0 --name rtb
          kubectl create namespace rtb
          kubectl -n rtb apply -f deploy/helm/test/valkey.yaml
          kubectl -n rtb create secret generic realtime-backbone-secrets \
            --from-literal=CENTRIFUGO_HTTP_API_KEY=ci-api-key \
            --from-literal=CENTRIFUGO_GRPC_API_KEY=ci-grpc-key \
            --from-literal=CENTRIFUGO_ENGINE_REDIS_ADDRESS=redis://valkey:6379
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt > signing.pem
          kubectl -n rtb create secret generic realtime-backbone-gateway \
            --from-literal=CENTRIFUGO_HTTP_API_KEY=ci-api-key \
            --from-file=RTB_SIGNING_KEY=signing.pem \
            --from-file=RTB_GATEWAY_CONFIG_JSON=deploy/helm/test/gateway.json
          kubectl -n rtb rollout status deploy/valkey --timeout=120s
          helm install rtb deploy/helm/realtime-backbone -n rtb -f deploy/helm/test/kind-values.yaml --set gateway.enabled=true --wait --timeout 180s
          helm test rtb -n rtb
      - name: A labeled namespace can publish
        run: |
          kubectl create namespace pubs
          kubectl label namespace pubs realtime-backbone/publisher=true
          kubectl -n pubs run curl --rm -i --restart=Never --image=curlimages/curl:8.17.0 -- \
            curl -sf -H 'X-API-Key: ci-api-key' -d '{"channel":"replay:t-ci.run.a","data":{"v":1}}' \
            http://realtime-backbone-internal.rtb:9000/api/publish
      - name: An unlabeled namespace can't reach the API, but can publish through the gateway
        run: |
          ! kubectl run direct --rm -i --restart=Never --image=curlimages/curl:8.17.0 -- \
            curl -sf -m 5 -H 'X-API-Key: ci-api-key' -d '{"channel":"replay:t-ci.run.a","data":{"v":1}}' \
            http://realtime-backbone-internal.rtb:9000/api/publish
          kubectl run gw --rm -i --restart=Never --image=curlimages/curl:8.17.0 -- \
            curl -sf -H 'Authorization: Bearer ci-client-key' -d '{"channel":"replay:t-ci.run.a","type":"ci.ping","data":{"v":1}}' \
            http://realtime-backbone-gateway.rtb:8090/v1/publish
