# One tag releases everything at one version: vX.Y.Z
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  CENTRIFUGO_VERSION: v6.9.7

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - name: realtime-backbone
            dockerfile: images/backbone/Dockerfile
          - name: realtime-backbone-demo
            dockerfile: images/demo/Dockerfile
          - name: realtime-backbone-gateway
            dockerfile: images/gateway/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Hub login, when its secrets are set
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, matrix.name) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            dev.realtime-backbone.centrifugo.version=${{ env.CENTRIFUGO_VERSION }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CENTRIFUGO_VERSION=${{ env.CENTRIFUGO_VERSION }}
          sbom: true
          provenance: mode=max

  chart:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Package and push the chart to ghcr.io as an OCI artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          CHART=deploy/helm/realtime-backbone
          sed -i "s#ghcr.io/mjczone/realtime-backbone:[0-9.]*#ghcr.io/${OWNER}/realtime-backbone:${VERSION}#; s#repository: mjczone/realtime-backbone#repository: ${OWNER}/realtime-backbone#; s#^    tag: \".*\"#    tag: \"${VERSION}\"#" "$CHART/values.yaml"
          helm repo add centrifugal https://centrifugal.github.io/helm-charts
          helm dependency build "$CHART"
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "realtime-backbone-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

  # Nothing is published to npm, NuGet or PyPI unless the repository variable PUBLISH_PACKAGES is "true".
  npm:
    if: ${{ vars.PUBLISH_PACKAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./ts/*" --filter "!@mjczone/realtime-integration" exec npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: pnpm build && pnpm test
      # Trusted publishing: each package needs a trusted publisher on npmjs.com for this repository and release.yml.
      # pnpm pack turns workspace:* into real versions; npm publish does the OIDC login and adds provenance.
      - run: |
          pnpm -r --filter "./ts/*" --filter "!@mjczone/realtime-integration" exec pnpm pack --pack-destination "$RUNNER_TEMP/npm"
          for f in "$RUNNER_TEMP"/npm/*.tgz; do npm publish "$f" --access public; done

  # Trusted publishing: each package needs a publisher on PyPI for this repository, release.yml and
  # its own environment (pypi-contract, ...). PyPI allows one pending publisher per environment.
  pypi:
    if: ${{ vars.PUBLISH_PACKAGES == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [contract, publisher, tokens, agui]
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - name: Build the package at the tag's version
        run: |
          sed -i "s/^version = \".*\"/version = \"${GITHUB_REF_NAME#v}\"/" "${{ matrix.package }}/pyproject.toml"
          uv build --package "mjczone-realtime-${{ matrix.package }}" --out-dir dist
      - run: uv publish dist/*

  nuget:
    if: ${{ vars.PUBLISH_PACKAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet pack MJCZone.Realtime.slnx -c Release -p:Version="${GITHUB_REF_NAME#v}" -o out
      # Trusted publishing: add a policy on nuget.org for this repository and release.yml first.
      # NUGET_USER is the nuget.org profile name (not the email).
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
